<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div>
        <form action="form fill 2 .html">

            <h1 style="text-align: center; ">Pets pizza Delivery </h1>

            <h2 style="text-align: center; "> Online Order From </h2>

            <p style="text-align: center; "> * required fields </p>

            <fieldset>
                <legend>customer details</legend>

                <label for="24"> *Name </label>
                <input type="text" id="24" placeholder="Enter your full name">

                <br><br>
                <label for=""> *Address </label>
                <input type="text">

                <br><br>
                <label for="">*Town/City</label>
                <input type="text">

                <br> <br>
                <label for="">*postcode</label>
                <input type="text">

                <br><br>
                <label for="">*Tel</label>
                <input type="text">

                <br><br>
                <label for="">*Email</label>
                <input type="text">

            </fieldset>

            <div style="display: flex; gap: 20px; ">
                <fieldset>

                    <legend>Topping*</legend>

                    <label for="21">Margherita</label>
                    <input type="radio" id="21">

                    <br>
                    <label for="23">Four Seasons</label>
                    <input type="radio" id="23">

                    <br>
                    <label for="43">Meat Feast</label>
                    <input type="radio" id="43">
                </fieldset>

                <fieldset>

                    <legend>size*</legend>

                    <label for="54">small</label>
                    <input type="radio" id="54">

                    <br>
                    <label for="98">Medium</label>
                    <input type="radio" id="98">

                    <br>
                    <label for="76">Large</label>
                    <input type="radio" id="76">

                </fieldset>

                <fieldset>

                    <legend>Extras</legend>

                    <label for="56">Mushrooms</label>
                    <input type="checkbox" id="56">

                    <br>
                    <label for="67">Green peppers</label>
                    <input type="checkbox" id="67">

                    <br>
                    <label for="78">Anchovies</label>
                    <input type="checkbox" id="78">

                    <br>
                    <label for="90">Extra Cheese</label>
                    <input type="checkbox" id="90">

                </fieldset>

            </div>

            <fieldset>

                <legend>Delivery</legend>

                <label for="44">Preferred delivery time</label>
                <input type="time" id="44" required>

                <br>
                <label for="94">Delivery instruction</label>
                <br>
                <textarea name="instructions" id="94"></textarea>
                <br>
                <button type="submit"> submit here </button>

            </fieldset>

        </form>

    </div>
</body>

</html>
