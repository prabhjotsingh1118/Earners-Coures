<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        table,
        tr,
        td,
        th,
        tfoot {
            /* yeh eliye hota hai kiyuki css ki property hai esse jese table,td etc likha hai thoo yeh property un tags par apply hoo gaye gi */
            /* aur th (table head) high light ho jata hai aur centre mein aa jata hai */
            border: 1px solid black;
            border-collapse: collapse;
        }
    </style>

</head>

<body>
    <div>
        <table>
            <tr>
                <td rowspan="3">day</td>
                <td colspan="4">Seminar</td>
            </tr>
            <tr>
                <td colspan="2">schedule</td>
                <td rowspan="2">topic</td>
            </tr>

            <tr>
                <td>begins</td>
                <td>end</td>
            </tr>

            <tr>
                <td rowspan="2">monday</td>
                <td rowspan="2">5</td>
                <td rowspan="2">8</td>
                <td>introduction to XML</td>
            </tr>

            <tr>
                <td>validit relax ng</td>
            </tr>

            <tr>
                <td rowspan="4">tue</td>
                <td>8</td>
                <td>11</td>
                <td rowspan="2" style="padding: 7px;">xpath</td>
                <!-- yeh style="padding: 7px;" yeh isliye hai kiyu ki yeh line ko dodha upar niche karne mein kam aata hai px means pixals -->
            </tr>

            <tr>
                <td rowspan="2">11</td>
                <td rowspan="2">2</td>
            </tr>

            <tr>
                <td rowspan="2">xsl</td>
            </tr>

            <tr>
                <td>2</td>
                <td>5</td>
            </tr>

            <tr>
                <td>wed</td>
                <td>8</td>
                <td>12</td>
                <td>xsl</td>
            </tr>

        </table>
    </div>
</body>

</html>
