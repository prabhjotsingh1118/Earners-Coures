
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sakura Dream 🌸</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="moon"></div>

  <div class="scene">
    <div class="mountain mountain-back"></div>
    <div class="mountain mountain-front"></div>
    <div class="lake"></div>
    <div class="reflection"></div>

    <div class="tree tree-left">
      <div class="trunk"></div>
      <div class="branch branch-one"></div>
      <div class="branch branch-two"></div>
      <div class="blossoms" id="blossoms"></div>
    </div>

    <div class="tree tree-right">
      <div class="trunk"></div>
      <div class="branch branch-one"></div>
      <div class="branch branch-two"></div>
      <div class="blossoms blossoms-right"></div>
    </div>
  </div>

  <div class="stars" id="stars"></div>
  <div class="petals" id="petals"></div>
  <div class="cursor-glow"></div>

  <div class="caption">
    <span>春の夢 · HARU NO YUME</span>
    <h1>Sakura Dreams</h1>
    <p>Somewhere between the moon and the blossoms.</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
